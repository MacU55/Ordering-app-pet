spring:
  profiles:
    group:
      local:
        - dev
      test:
        - test
      stage:
        - stage
      prod:
        - prod
    active: dev

  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
